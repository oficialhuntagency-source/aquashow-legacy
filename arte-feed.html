<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Feed — Aquashow Legacy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Manrope:wght@600;700;800;900&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
}

.card {
  width: 1080px;
  height: 1080px;
  position: relative;
  overflow: hidden;
  background: #020C1E;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ── Fundo gradiente vibrante ── */
.bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 900px 600px at 50% 30%, #0A3A8A 0%, transparent 70%),
    radial-gradient(ellipse 600px 500px at 80% 80%, #0066CC 0%, transparent 60%),
    radial-gradient(ellipse 500px 400px at 20% 80%, #004499 0%, transparent 60%),
    #020C1E;
}

/* ── Onda base (clip-path) ── */
.wave {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 320px;
  background: linear-gradient(180deg, transparent 0%, #0055BB 40%, #0033AA 100%);
  clip-path: ellipse(120% 100% at 50% 100%);
  opacity: 0.5;
}
.wave2 {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 200px;
  background: linear-gradient(180deg, #00AAEE 0%, #0088CC 100%);
  clip-path: ellipse(110% 100% at 50% 100%);
  opacity: 0.3;
}

/* ── Reflexo de luz no topo ── */
.light {
  position: absolute;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 800px; height: 600px;
  background: radial-gradient(ellipse, rgba(0,180,255,0.12) 0%, transparent 70%);
}

/* ── TOPO: badge ── */
.top-bar {
  position: absolute;
  top: 56px; left: 60px; right: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 26px;
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 100px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.8);
}
.brand-dot {
  width: 9px; height: 9px;
  background: #FFB300;
  border-radius: 50%;
  box-shadow: 0 0 10px #FFB300, 0 0 20px rgba(255,179,0,0.5);
}
.event-tag {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
}

/* ── CENTRO: título ── */
.center {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-top: -40px;
}

.title {
  font-family: 'Fredoka', 'Impact', 'Arial Black', sans-serif;
  font-weight: 700;
  font-size: 210px;
  line-height: 0.85;
  letter-spacing: -0.03em;
  /* Efeito outline + preenchimento */
  color: transparent;
  -webkit-text-stroke: 6px rgba(255,255,255,0.95);
  text-shadow:
    0 0 120px rgba(0,200,255,0.6),
    0 0 60px rgba(0,180,255,0.4);
  margin-bottom: 32px;
  position: relative;
}
/* Camada de cor por baixo */
.title::after {
  content: 'aquashow';
  position: absolute;
  inset: 0;
  color: #00D4FF;
  -webkit-text-stroke: 0;
  opacity: 0.35;
  filter: blur(2px);
  pointer-events: none;
}

/* Data pill */
.date-pill {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  background: #FFB300;
  color: #020C1E;
  padding: 18px 54px;
  border-radius: 100px;
  font-family: 'Fredoka', 'Arial Black', sans-serif;
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -0.01em;
  transform: rotate(-1deg);
  box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 16px 50px rgba(255,179,0,0.45);
  border: 4px solid rgba(255,255,255,0.5);
  margin-bottom: 40px;
}
.date-sep { opacity: 0.4; font-size: 36px; }

/* Sub */
.sub {
  font-size: 22px;
  font-weight: 600;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.01em;
  margin-bottom: 44px;
}

/* Chips */
.chips {
  display: flex;
  gap: 12px;
  margin-bottom: 52px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 100px;
  font-size: 17px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
}

/* CTA */
.cta-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 26px 64px;
  background: #FFB300;
  color: #020C1E;
  border-radius: 100px;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 0.02em;
  box-shadow: 0 8px 0 #996800, 0 16px 50px rgba(255,179,0,0.45);
}
.btn-arrow { font-size: 22px; }
.price-note {
  font-size: 16px;
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── RODAPÉ ── */
.footer {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 72px;
  background: rgba(0,0,0,0.5);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 60px;
  z-index: 20;
}
.footer-left {
  font-family: 'Fredoka', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.04em;
}
.footer-url {
  font-size: 16px;
  font-weight: 700;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.06em;
}
.footer-right {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: right;
}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="wave"></div>
  <div class="wave2"></div>
  <div class="light"></div>

  <!-- Topo -->
  <div class="top-bar">
    <div class="brand">
      <span class="brand-dot"></span>
      Legacy · Lisboa
    </div>
    <div class="event-tag">Passeio Oficial · 2026</div>
  </div>

  <!-- Centro -->
  <div class="center">
    <div class="title">aquashow</div>

    <div class="date-pill">
      22/08
      <span class="date-sep">·</span>
      sábado
    </div>

    <div class="sub">Água · Sol · Amizade · Algarve</div>

    <div class="chips">
      <div class="chip">📍 Quarteira · Algarve</div>
      <div class="chip">🕖 Saída 07h00</div>
      <div class="chip">🚌 Autocarro incl.</div>
    </div>

    <div class="cta-wrap">
      <div class="btn">
        Garantir minha vaga
        <span class="btn-arrow">→</span>
      </div>
      <div class="price-note">a partir de €50 · parcelado em 3x</div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="footer">
    <div class="footer-left">Legacy · Lisboa</div>
    <div class="footer-url">aquashow-legacy.vercel.app</div>
    <div class="footer-right">Igreja Batista<br>da Lagoinha</div>
  </div>
</div>
</body>
</html>
